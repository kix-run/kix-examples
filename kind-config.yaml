# kind-config.yaml — single-node kind cluster for the Kix demo.
#
# A single control-plane node is enough for this demo. Port mappings are
# omitted; access services via `scripts/forward.sh` (kubectl port-forward).

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kix-demo
nodes:
  - role: control-plane
